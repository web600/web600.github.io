<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="description" content="企業級 macOS 桌面環境模擬器 — 多視窗管理、選單列、控制中心、通知中心、Dock 放大效果與五個原生風格應用程式。">
<title>macOS · 桌面環境模擬器</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/window.css">
<link rel="stylesheet" href="css/apps.css">
</head>
<body>

<div id="screen" class="screen" aria-label="macOS 桌面">

  <!-- ══════════ 開機 ══════════ -->
  <div id="boot" class="boot">
    <div class="boot-logo" id="bootLogo"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-apple"></use></svg></div>
    <div class="boot-bar" role="progressbar" aria-label="開機進度"><i id="bootFill"></i></div>
    <div class="boot-hint" id="bootHint">macOS 正在啟動…（按任意鍵略過）</div>
  </div>

  <!-- ══════════ 登入 ══════════ -->
  <div id="login" class="login">
    <div id="loginBg" class="login-bg"></div>
    <div class="login-clock">
      <b id="loginTime">09:41</b>
      <span id="loginDate">10月15日 週三</span>
    </div>
    <form class="login-user" id="loginForm" autocomplete="off">
      <div class="login-avatar" id="loginAvatar">A</div>
      <div class="login-name" id="loginName">Apple 使用者</div>
      <div class="login-field">
        <input id="loginPass" type="password" placeholder="輸入密碼（任意字元）" aria-label="密碼" spellcheck="false">
        <button id="loginGo" type="submit" aria-label="登入"><svg viewBox="0 0 24 24"><use href="#i-arrow-right"></use></svg></button>
      </div>
      <div class="login-hint" id="loginHint">按 Return 或點擊箭頭即可登入</div>
      <button type="button" class="login-fp" id="loginFp" hidden title="Touch ID">Touch&nbsp;ID</button>
    </form>
  </div>

  <!-- ══════════ 桌面 ══════════ -->
  <div id="desktop" class="desktop" hidden>

    <div id="wallpaper" class="wallpaper"></div>
    <div id="wallpaperBlur" class="wallpaper-blur"></div>

    <div id="desktopIcons" class="desktop-icons" aria-label="桌面項目"></div>

    <div id="windows" class="windows" aria-label="視窗"></div>
    <div id="snapPreview" class="snap-preview" hidden></div>

    <!-- 選單列 -->
    <div id="menubar" class="menubar">
      <div class="mb-left">
        <button class="mb-item mb-apple" id="mbApple" aria-label="蘋果選單"><svg viewBox="0 0 24 24"><use href="#i-apple"></use></svg></button>
        <div class="mb-menus" id="mbMenus"></div>
      </div>
      <div class="mb-right" id="mbRight"></div>
    </div>
    <div id="mbDrop" class="mb-drop glass" hidden></div>

    <!-- Dock -->
    <div id="dock" class="dock" role="toolbar" aria-label="Dock"></div>

    <!-- 控制中心 -->
    <div id="cc" class="cc glass" hidden></div>

    <!-- 通知中心 -->
    <aside id="nc" class="nc" hidden aria-label="通知中心">
      <div class="nc-inner" id="ncInner"></div>
    </aside>

    <!-- 聚光燈 -->
    <div id="spotlight" class="spotlight" hidden>
      <div class="sp-box glass">
        <div class="sp-row">
          <svg class="sp-ic" viewBox="0 0 24 24"><use href="#i-search"></use></svg>
          <input id="spInput" type="text" placeholder="搜尋應用程式、檔案與系統指令" aria-label="聚光燈搜尋" spellcheck="false">
        </div>
        <div class="sp-results" id="spResults"></div>
      </div>
    </div>

    <!-- ⌘Tab 切換器 -->
    <div id="switcher" class="switcher" hidden></div>

    <!-- 提示 / 亮度 / 右鍵選單 -->
    <div id="toasts" class="toasts"></div>
    <div id="dim" class="dim"></div>
    <div id="night" class="night"></div>
    <div id="ctxMenu" class="ctx glass" hidden></div>
    <div id="hud" class="hud glass" hidden></div>

  </div><!-- /desktop -->
</div><!-- /screen -->

<script src="js/core.js"></script>
<script src="js/wm.js"></script>
<script src="js/apps/registry.js"></script>
<script src="js/apps/misc.js"></script>
<script src="js/apps/finder.js"></script>
<script src="js/apps/safari.js"></script>
<script src="js/apps/terminal.js"></script>
<script src="js/apps/notes.js"></script>
<script src="js/apps/settings.js"></script>
<script src="js/apps/media.js"></script>
<script src="js/shell.js"></script>
<script src="js/main.js"></script>
</body>
</html>
