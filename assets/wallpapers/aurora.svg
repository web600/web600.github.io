<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1200" preserveAspectRatio="xMidYMid slice" width="1920" height="1200">
  <defs>
    <linearGradient id="a-base" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#1e2760"/>
      <stop offset="0.55" stop-color="#121737"/>
      <stop offset="1" stop-color="#0a0d1e"/>
    </linearGradient>
    <radialGradient id="a-g1" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6b86ff" stop-opacity="1"/>
      <stop offset="1" stop-color="#4f6bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="a-g2" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#c47dff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#b46bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="a-g3" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff6fa8" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#ff5f9e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="a-g4" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#49e2ff" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#31d7ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="a-g5" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#243a8f" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#101a4d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="a-veil" x1="0" y1="1" x2="0.4" y2="0">
      <stop offset="0" stop-color="#050914" stop-opacity="0.55"/>
      <stop offset="0.7" stop-color="#04060f" stop-opacity="0"/>
    </linearGradient>
    <filter id="a-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="86"/>
    </filter>
    <filter id="a-soft2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
    <filter id="a-grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.075"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1920" height="1200" fill="url(#a-base)"/>

  <g filter="url(#a-soft)">
    <ellipse cx="1420" cy="220" rx="760" ry="380" fill="url(#a-g2)"/>
    <ellipse cx="600" cy="120" rx="700" ry="330" fill="url(#a-g4)"/>
    <ellipse cx="980" cy="700" rx="900" ry="420" fill="url(#a-g1)"/>
    <ellipse cx="1560" cy="980" rx="620" ry="320" fill="url(#a-g3)"/>
    <ellipse cx="220" cy="900" rx="700" ry="380" fill="url(#a-g5)"/>
  </g>

  <g filter="url(#a-soft2)" opacity="0.75">
    <path d="M -100 980 C 380 700, 700 1180, 1180 860 C 1520 640, 1760 760, 2020 600 L 2020 1300 L -100 1300 Z" fill="#101a4d" opacity="0.62"/>
    <path d="M -100 1120 C 420 900, 820 1300, 1300 1020 C 1640 830, 1820 940, 2020 840 L 2020 1300 L -100 1300 Z" fill="#080c1a" opacity="0.78"/>
  </g>

  <rect width="1920" height="1200" fill="url(#a-veil)"/>
  <rect width="1920" height="1200" filter="url(#a-grain)" opacity="0.55" style="mix-blend-mode:overlay"/>
</svg>
